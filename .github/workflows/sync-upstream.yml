name: Scheduled Merge from Upstream
on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allows manual triggering in the GitHub UI

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add upstream https://github.com/evanbio/The_Economist.git
          git fetch upstream
          git merge upstream/main --ff-only || (git merge upstream/main --no-edit && echo "Merged with non-FF")
          git push origin main
